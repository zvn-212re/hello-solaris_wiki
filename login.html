<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="description" content="Solaris Wiki 私有访问验证入口。">
  <meta name="theme-color" content="#f4ead6">
  <script>
    (() => {
      try {
        if (localStorage.getItem("solarisTheme") === "night") {
          document.documentElement.dataset.theme = "night";
        }
      } catch {}
    })();
  </script>
  <title>Solaris Wiki · 访问验证</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="auth-shell">
    <div class="auth-scenery" aria-hidden="true">
      <span class="auth-sun"></span>
      <span class="auth-mountain mountain-back"></span>
      <span class="auth-mountain mountain-mid"></span>
      <span class="auth-mountain mountain-front"></span>
      <span class="auth-shore"></span>
      <span class="auth-rock rock-left"></span>
      <span class="auth-rock rock-right"></span>
    </div>

    <section class="auth-panel" aria-labelledby="authTitle" data-auth-panel>
      <div class="auth-brand">
        <div>
          <p class="auth-kicker">PRIVATE ORBIT</p>
          <h1 id="authTitle">Solaris Wiki</h1>
          <p class="auth-tagline">访问验证 · 让信号回到档案室</p>
        </div>
        <div class="auth-tools" aria-label="辅助入口">
          <button class="theme-lamp auth-lamp" type="button" data-theme-toggle aria-label="切换夜间模式" aria-pressed="false">
            <span class="lamp-cord" aria-hidden="true"></span>
            <span class="lamp-head" aria-hidden="true"></span>
            <span class="lamp-glow" aria-hidden="true"></span>
          </button>
          <a href="login.html?next=/index.html" aria-label="首页需要验证"><i class="ri-home-4-line"></i></a>
        </div>
      </div>

      <div class="auth-form" data-auth-root>
        <div class="auth-tabs" role="tablist" aria-label="选择登录方式">
          <button class="auth-tab is-active" type="button" id="visitorTab" role="tab" aria-selected="true" aria-controls="visitorPanel" data-auth-tab="visitor">
            <i class="ri-key-2-line" aria-hidden="true"></i>
            <span>访客邀请码</span>
          </button>
          <button class="auth-tab" type="button" id="adminTab" role="tab" aria-selected="false" aria-controls="adminPanel" data-auth-tab="admin">
            <i class="ri-shield-keyhole-line" aria-hidden="true"></i>
            <span>管理员登录</span>
          </button>
        </div>

        <form class="auth-channel is-active" id="visitorPanel" role="tabpanel" aria-labelledby="visitorTab" data-auth-form="visitor">
          <div class="auth-field-group">
            <p class="auth-mode-label">VISITOR PASS</p>
            <label class="auth-field">
              <span>访客邀请码</span>
              <input type="password" name="inviteCode" autocomplete="one-time-code" placeholder="输入邀请码" data-invite-code required>
            </label>
            <p class="auth-hint">普通权限可访问首页、项目档案、文章和搜索内容。</p>
          </div>
          <div class="auth-row">
            <div class="auth-social">
              <span>默认去向：</span>
              <a href="login.html?next=/projects.html" aria-label="项目档案需要验证"><i class="ri-archive-2-line"></i></a>
            </div>
            <button class="auth-submit" type="submit"><i class="ri-login-box-line" aria-hidden="true"></i> 访客进入</button>
          </div>
        </form>

        <form class="auth-channel" id="adminPanel" role="tabpanel" aria-labelledby="adminTab" data-auth-form="admin" hidden>
          <div class="auth-field-group">
            <p class="auth-mode-label">ADMIN ACCESS</p>
            <label class="auth-field">
              <span>管理员账号</span>
              <input type="text" name="username" autocomplete="username" placeholder="admin" data-admin-username required>
            </label>
            <label class="auth-field">
              <span>管理员密码</span>
              <input type="password" name="password" autocomplete="current-password" placeholder="输入管理员密码" data-admin-password required>
            </label>
            <p class="auth-hint">管理员权限可进入 CMS 后台和留言投稿审核台。</p>
          </div>
          <div class="auth-row">
            <div class="auth-social">
              <span>默认去向：</span>
              <a href="login.html?mode=admin&next=/admin/" aria-label="内容后台需要管理员验证"><i class="ri-settings-3-line"></i></a>
            </div>
            <button class="auth-submit" type="submit"><i class="ri-login-circle-line" aria-hidden="true"></i> 进入后台</button>
          </div>
        </form>

        <p class="auth-status" data-auth-status aria-live="polite">请选择登录方式。验证通过后会创建仅服务端可读的访问 Cookie。</p>
      </div>

      <footer class="auth-foot">
        <span>这是 Solaris Wiki 私有访问入口，不开放注册。</span>
        <a href="login.html?next=/index.html">进入首页 <i class="ri-arrow-right-s-line"></i></a>
      </footer>
    </section>

    <div class="auth-transition" aria-hidden="true" data-auth-transition>
      <span data-transition-text>ACCESS GRANTED</span>
    </div>
  </main>

  <script src="js/theme-toggle.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
