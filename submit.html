<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (() => {
      try {
        if (localStorage.getItem("solarisTheme") === "night") {
          document.documentElement.dataset.theme = "night";
        }
      } catch {}
    })();
  </script>
  <meta name="description" content="向 Solaris Wiki 投稿。">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f4ead6">
  <link rel="canonical" href="https://solaris.wiki/submit.html">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Solaris Wiki | 投稿</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="主导航">
      <a class="brand" href="index.html">
        <span class="brand-mark"><i class="ri-planet-line"></i></span>
        <span>Solaris Wiki</span>
      </a>
      <div class="nav-links">
        <a href="index.html">首页</a>
        <a href="projects.html">项目</a>
        <a href="articles.html">文章</a>
        <a href="about.html">关于</a>
      </div>
      <div class="nav-actions">
        <button class="theme-lamp" type="button" data-theme-toggle aria-label="切换夜间模式" aria-pressed="false">
          <span class="lamp-cord" aria-hidden="true"></span>
          <span class="lamp-head" aria-hidden="true"></span>
          <span class="lamp-glow" aria-hidden="true"></span>
        </button>
      </div>
    </nav>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow"><i class="ri-send-plane-line"></i> Submission</p>
        <h1>投稿入口</h1>
        <p>访客可以提交文章、项目线索或反馈。内容会进入审核队列，不会直接公开。</p>
      </div>
    </section>

    <section class="section">
      <div class="container tool-layout">
        <form class="guestbook-form cms-form" data-submission-form>
          <label>
            <span>类型</span>
            <select name="type">
              <option value="post">文章</option>
              <option value="project">项目</option>
              <option value="feedback">反馈</option>
            </select>
          </label>
          <label>
            <span>标题</span>
            <input name="title" maxlength="80" required>
          </label>
          <label>
            <span>作者</span>
            <input name="author" maxlength="40" placeholder="匿名投稿者">
          </label>
          <label>
            <span>联系方式</span>
            <input name="contact" maxlength="120" placeholder="邮箱 / GitHub / 其他">
          </label>
          <label class="wide-field">
            <span>摘要</span>
            <input name="summary" maxlength="260">
          </label>
          <label class="wide-field">
            <span>正文</span>
            <textarea name="content" rows="10" maxlength="8000" required placeholder="可以写 Markdown。"></textarea>
          </label>
          <button class="button" type="submit"><i class="ri-send-plane-line"></i> 发送投稿</button>
          <p class="guestbook-status" data-submission-status>投稿会进入审核队列。</p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <a href="https://solaris.wiki" target="_blank" rel="noopener noreferrer">solaris.wiki</a>
      <div class="footer-links">
        <a href="https://github.com/zvn-212re" target="_blank" rel="noopener noreferrer"><i class="ri-github-line"></i> GitHub</a>
        <a href="mailto:xiechanghui9@gmail.com"><i class="ri-mail-line"></i> xiechanghui9@gmail.com</a>
        <button class="footer-action" type="button" data-auth-logout><i class="ri-logout-box-r-line"></i> 退出</button>
      </div>
      <div class="music-player" data-music-player>
        <button class="music-toggle" type="button" data-music-toggle aria-expanded="false">
          <i class="ri-music-2-line"></i> MUSIC
        </button>
        <div class="music-panel" data-music-panel>
          <div class="music-display">
            <span class="music-led" data-music-led></span>
            <span data-music-title>8-bit 海面信号</span>
          </div>
          <div class="music-controls">
            <button class="music-button" type="button" data-music-play>PLAY</button>
            <select class="music-select" data-music-track aria-label="选择音乐">
              <option value="signal">8-bit 海面信号</option>
              <option value="orbit">像素轨道巡航</option>
              <option value="terminal">终端夜航</option>
            </select>
          </div>
          <label class="music-volume">
            <span>VOL</span>
            <input type="range" min="0" max="100" value="36" data-music-volume>
          </label>
        </div>
      </div>
    </div>
  </footer>

  <script src="js/theme-toggle.js"></script>
  <script src="js/music-player.js"></script>
  <script src="js/submission-form.js"></script>
  <script src="js/session-controls.js"></script>
  <script src="js/site-router.js"></script>
</body>
</html>
