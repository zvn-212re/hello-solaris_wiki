<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (() => {
      try {
        if (localStorage.getItem("solarisTheme") === "night") {
          document.documentElement.dataset.theme = "night";
        }
      } catch {}
    })();
  </script>
  <meta name="description" content="Solaris Wiki 站内搜索。">
  <meta name="theme-color" content="#f4ead6">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Solaris Wiki">
  <meta property="og:title" content="Solaris Wiki | 搜索">
  <meta property="og:description" content="Solaris Wiki 站内搜索。">
  <meta property="og:url" content="https://solaris.wiki/search.html">
  <meta property="og:image" content="https://solaris.wiki/images/3818c2c7aa04f65ddb23e7d25a159026522770383.png@360w_270h_1s.avif">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Solaris Wiki | 搜索">
  <meta name="twitter:description" content="Solaris Wiki 站内搜索。">
  <meta name="twitter:image" content="https://solaris.wiki/images/3818c2c7aa04f65ddb23e7d25a159026522770383.png@360w_270h_1s.avif">
  <link rel="canonical" href="https://solaris.wiki/search.html">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Solaris Wiki | 搜索</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="主导航">
      <a class="brand" href="index.html">
        <span class="brand-mark"><i class="ri-planet-line"></i></span>
        <span>Solaris Wiki</span>
      </a>
      <div class="nav-links">
        <a href="index.html">首页</a>
        <a href="projects.html">项目</a>
        <a href="articles.html">文章</a>
        <a href="about.html">关于</a>
      </div>
      <div class="nav-actions">
        <button class="theme-lamp" type="button" data-theme-toggle aria-label="切换夜间模式" aria-pressed="false">
          <span class="lamp-cord" aria-hidden="true"></span>
          <span class="lamp-head" aria-hidden="true"></span>
          <span class="lamp-glow" aria-hidden="true"></span>
        </button>
      </div>
    </nav>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow"><i class="ri-search-line"></i> Search</p>
        <h1>站内搜索</h1>
        <p>搜索项目、文章和站点更新。索引会在每次构建时自动生成。</p>
      </div>
    </section>

    <section class="section">
      <div class="container tool-layout" data-search>
        <div class="tool-panel">
          <label class="field-stack">
            <span>关键词</span>
            <input type="search" placeholder="例如：Agent、番茄钟、CMS" data-search-input autofocus>
          </label>
          <p class="guestbook-status">结果数：<span data-search-count>0 / 0</span></p>
        </div>
        <div class="guestbook-board">
          <p class="empty-tomato" data-search-empty hidden>没有搜索结果。</p>
          <div class="guestbook-list" data-search-results></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <a href="https://solaris.wiki" target="_blank" rel="noopener noreferrer">solaris.wiki</a>
      <div class="footer-links">
        <a href="https://github.com/zvn-212re" target="_blank" rel="noopener noreferrer"><i class="ri-github-line"></i> GitHub</a>
        <a href="mailto:xiechanghui9@gmail.com"><i class="ri-mail-line"></i> xiechanghui9@gmail.com</a>
      </div>
      <div class="music-player" data-music-player>
        <button class="music-toggle" type="button" data-music-toggle aria-expanded="false">
          <i class="ri-music-2-line"></i> MUSIC
        </button>
        <div class="music-panel" data-music-panel>
          <div class="music-display">
            <span class="music-led" data-music-led></span>
            <span data-music-title>8-bit 海面信号</span>
          </div>
          <div class="music-controls">
            <button class="music-button" type="button" data-music-play>PLAY</button>
            <select class="music-select" data-music-track aria-label="选择音乐">
              <option value="signal">8-bit 海面信号</option>
              <option value="orbit">像素轨道巡航</option>
              <option value="terminal">终端夜航</option>
            </select>
          </div>
          <label class="music-volume">
            <span>VOL</span>
            <input type="range" min="0" max="100" value="36" data-music-volume>
          </label>
        </div>
      </div>
    </div>
  </footer>

  <script src="js/theme-toggle.js"></script>
  <script src="js/music-player.js"></script>
  <script src="js/search.js"></script>
  <script src="js/site-router.js"></script>
</body>
</html>
