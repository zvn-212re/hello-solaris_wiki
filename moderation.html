<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (() => {
      try {
        if (localStorage.getItem("solarisTheme") === "night") {
          document.documentElement.dataset.theme = "night";
        }
      } catch {}
    })();
  </script>
  <meta name="robots" content="noindex">
  <meta name="description" content="Solaris Wiki 留言与投稿审核台。">
  <meta name="theme-color" content="#f4ead6">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Solaris Wiki | 审核台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="主导航">
      <a class="brand" href="index.html">
        <span class="brand-mark"><i class="ri-planet-line"></i></span>
        <span>Solaris Wiki</span>
      </a>
      <div class="nav-links">
        <a href="index.html">首页</a>
        <a href="articles.html">文章</a>
        <a href="login.html">验证登录</a>
        <a href="admin/">内容后台</a>
      </div>
      <div class="nav-actions">
        <button class="theme-lamp" type="button" data-theme-toggle aria-label="切换夜间模式" aria-pressed="false">
          <span class="lamp-cord" aria-hidden="true"></span>
          <span class="lamp-head" aria-hidden="true"></span>
          <span class="lamp-glow" aria-hidden="true"></span>
        </button>
      </div>
    </nav>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow"><i class="ri-shield-check-line"></i> Moderation</p>
        <h1>留言与投稿审核台</h1>
        <p>通过验证登录页写入管理员令牌后，可以审核公开留言和访客投稿。</p>
      </div>
    </section>

    <section class="section">
      <div class="container moderation-layout" data-moderation>
        <div class="tool-panel moderation-token">
          <label class="field-stack">
            <span>备用管理员令牌</span>
            <input type="password" data-admin-token placeholder="已登录时可留空">
          </label>
          <button class="button" type="button" data-load-moderation><i class="ri-refresh-line"></i> 读取审核队列</button>
          <p class="guestbook-status" data-moderation-status>等待读取。</p>
        </div>

        <div class="moderation-columns">
          <section class="guestbook-board">
            <div class="guestbook-toolbar">
              <span class="panel-kicker">Guestbook</span>
            </div>
            <div class="guestbook-list" data-moderation-list="guestbook"></div>
          </section>
          <section class="guestbook-board">
            <div class="guestbook-toolbar">
              <span class="panel-kicker">Submissions</span>
            </div>
            <div class="guestbook-list" data-moderation-list="submissions"></div>
          </section>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <a href="https://solaris.wiki" target="_blank" rel="noopener noreferrer">solaris.wiki</a>
      <div class="footer-links">
        <a href="admin/"><i class="ri-settings-3-line"></i> Admin</a>
        <button class="footer-action" type="button" data-auth-logout><i class="ri-logout-box-r-line"></i> 退出</button>
      </div>
    </div>
  </footer>

  <script src="js/theme-toggle.js"></script>
  <script src="js/moderation-dashboard.js"></script>
  <script src="js/session-controls.js"></script>
</body>
</html>
